apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-server
  annotations:
    # Sticky sessions keep a client pinned to the pod holding its MCP session.
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "mcp-session"
spec:
  rules:
    - host: mcp.example.com
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
spec:
  sessionAffinity: ClientIP
  ports:
    - port: 8080
