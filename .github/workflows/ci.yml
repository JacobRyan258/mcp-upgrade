name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. No job below needs to write anything.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # The published CLI. Same matrix and same gates as before the monorepo
  # conversion, just run through the workspace.
  # ---------------------------------------------------------------------------
  scanner:
    name: Scanner — Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '24.x', '26.x']
        os: [ubuntu-latest]
        include:
          - node: '24.x'
            os: windows-latest
          - node: '24.x'
            os: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace libraries
        run: npm run build:libs

      - name: Type check
        run: npm run typecheck --workspace mcp-upgrade

      - name: Lint
        run: npm run lint --workspace mcp-upgrade

      - name: Unit and CLI integration tests
        run: npm run test --workspace mcp-upgrade

      - name: Build
        run: npm run build --workspace mcp-upgrade

  package:
    name: Packed CLI on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '26.x']

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace libraries
        run: npm run build:libs

      - name: Inspect npm dry run
        run: npm pack --dry-run --workspace mcp-upgrade

      - name: Pack, inspect, install, and execute externally
        run: npm run verify:package

  # ---------------------------------------------------------------------------
  # Shared contracts and the worker. The worker suite includes the hostile
  # archive corpus and the SSRF checks, so it needs no services.
  # ---------------------------------------------------------------------------
  libraries:
    name: Shared and worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace libraries
        run: npm run build:libs

      - name: Type check
        run: |
          npm run typecheck --workspace @mcp-upgrade/shared
          npm run typecheck --workspace @mcp-upgrade/worker

      - name: Lint
        run: |
          npm run lint --workspace @mcp-upgrade/shared
          npm run lint --workspace @mcp-upgrade/worker

      - name: Shared tests
        run: npm run test --workspace @mcp-upgrade/shared

      - name: Worker tests — hostile archives, SSRF, sanitisation
        run: npm run test --workspace @mcp-upgrade/worker

      - name: Build worker
        run: npm run build --workspace @mcp-upgrade/worker

  # ---------------------------------------------------------------------------
  # Database. Runs against a real Postgres: the guarantees under test are row
  # locks, unique indexes and RLS policies, none of which a mock reproduces.
  # ---------------------------------------------------------------------------
  database:
    name: Database — migrations, isolation, concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcp_upgrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mcp_upgrade_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mcp_upgrade_test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace libraries
        run: npm run build:libs

      - name: Type check and lint
        run: |
          npm run typecheck --workspace @mcp-upgrade/database
          npm run lint --workspace @mcp-upgrade/database

      - name: Validate migrations apply to an empty database
        run: npm run db:migrate

      - name: Validate migrations are idempotent
        run: npm run db:migrate

      - name: Database tests
        run: npm run test --workspace @mcp-upgrade/database

  # ---------------------------------------------------------------------------
  # Web application. Built against placeholder configuration: no real secret is
  # needed to prove the application compiles and renders.
  # ---------------------------------------------------------------------------
  web:
    name: Web — typecheck, lint, tests, production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      WORKER_SHARED_SECRET: ci-placeholder-secret-at-least-32-characters

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace libraries
        run: npm run build:libs

      - name: Type check
        run: npm run typecheck --workspace @mcp-upgrade/web

      - name: Lint
        run: npm run lint --workspace @mcp-upgrade/web

      - name: Unit tests
        run: npm run test --workspace @mcp-upgrade/web

      - name: Production build
        run: npm run build --workspace @mcp-upgrade/web

  # ---------------------------------------------------------------------------
  # Worker container. Proving the image builds, and that it did not accidentally
  # become a build environment, is part of the deploy contract.
  # ---------------------------------------------------------------------------
  worker-image:
    name: Worker container image
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the worker image
        run: docker build -f apps/worker/Dockerfile -t mcp-upgrade-worker:ci .

      - name: Confirm the image runs as a non-root user
        run: |
          user="$(docker run --rm --entrypoint id mcp-upgrade-worker:ci -un)"
          echo "image runs as: $user"
          test "$user" != "root"

      - name: Confirm no build tooling or web dependency reached the image
        run: |
          # A test runner or a whole web framework inside a container that
          # unpacks hostile archives is exactly what to leave out. TypeScript is
          # deliberately absent from this list: the scanner uses the compiler
          # API to parse source, so it is a runtime dependency.
          found=$(docker run --rm --entrypoint sh mcp-upgrade-worker:ci -c \
            'ls -d node_modules/next node_modules/react node_modules/react-dom \
                   node_modules/stripe node_modules/sharp node_modules/@playwright \
                   node_modules/playwright-core node_modules/.bin/vitest \
                   node_modules/.bin/eslint node_modules/.bin/next 2>/dev/null' || true)
          if [ -n "$found" ]; then
            echo "these should not be in the runtime image:"
            echo "$found"
            exit 1
          fi
          echo "no build tooling or web-only dependency present"

      - name: Confirm the hostile archive fixtures were not shipped
        run: |
          if docker run --rm --entrypoint sh mcp-upgrade-worker:ci -c \
             'ls apps/worker/test' 2>/dev/null; then
            echo "test fixtures are present in the runtime image"
            exit 1
          fi
          echo "no test fixtures present"

  # ---------------------------------------------------------------------------
  # Repository tooling. The Stripe provisioning and verification scripts run
  # against an in-memory gateway here: no Stripe credential is present in CI and
  # none is needed, which is the point — a green run must never depend on, or
  # touch, a real Stripe account.
  # ---------------------------------------------------------------------------
  tooling:
    name: Scripts — typecheck, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace libraries
        run: npm run build:libs

      - name: Type check
        run: npm run typecheck:scripts

      - name: Lint
        run: npm run lint:scripts

      - name: Tests
        run: npm run test:scripts

      # The audit that would have caught this repository's real state: a root
      # .env nothing loaded, an apps/web/.env.local silently outranking it with
      # a different Stripe account's key, and a tracked .env.example holding a
      # real Stripe object id. Runs without secrets and without network.
      - name: Environment file audit
        run: npm run verify:env-files

      - name: Confirm .env.local cannot be reintroduced as an override
        run: |
          # A forbidden file that defines anything must fail the audit, so the
          # override cannot come back quietly in a later branch.
          printf 'STRIPE_SECRET_KEY=sk_test_reintroduced\n' > apps/web/.env.local
          if npm run --silent verify:env-files; then
            echo "FAIL: the audit accepted an apps/web/.env.local that defines a runtime variable"
            rm -f apps/web/.env.local
            exit 1
          fi
          rm -f apps/web/.env.local
          echo "confirmed: a reintroduced .env.local override fails the audit"

      - name: Confirm the setup script refuses to run without a credential
        run: |
          # Exit code 1 with no key, and nothing resembling a key in the output.
          if npm run --silent stripe:setup -- --dry-run; then
            echo "the setup script should have refused"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Supply chain and secrets.
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Scan tracked files for secrets
        run: npm run check:secrets
