name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x', '24.x']
        os: [ubuntu-latest]
        include:
          # One non-Linux runner, because path handling is the most likely
          # source of a platform-specific bug in a file scanner.
          - node: '22.x'
            os: windows-latest
          - node: '22.x'
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  integration:
    name: Packaged CLI integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Pack tarball
        run: npm pack --pack-destination /tmp

      - name: Install the tarball into a clean project and exercise the CLI
        run: bash scripts/verify-package.sh

  publish-dry-run:
    name: npm publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      # Dry run only. This workflow never publishes.
      - name: Publish dry run
        run: npm publish --dry-run
