name: False positive / false negative
description: A rule fired on code it should not have, or missed code it should have caught
labels: [bug]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: "MCP2026-SESSION-001"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - False positive (fired but should not have)
        - False negative (should have fired but did not)
        - Wrong severity or confidence
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Minimal code snippet
      description: >
        The smallest snippet that reproduces it. Strip anything private —
        a reduced stand-in is fine as long as it still reproduces.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: reasoning
    attributes:
      label: Why the current behaviour is wrong
      description: >
        If you have it, cite the MCP specification page, changelog entry, SEP or
        official SDK guide that supports your reading.
    validations:
      required: true
